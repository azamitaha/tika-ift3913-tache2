name: IFT3913 - Tests tika-core

on:
  push:
    branches: [tache2-tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executer les tests tika-core
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp -pl tika-core -am test